[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "satellite-tile-prep"
version = "0.1.0"
description = "Turn large satellite scenes into normalised tiles and LR/HR pairs for super-resolution training."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rutuparn Kulkarni" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pandas>=2.1",
]

[project.optional-dependencies]
geo = ["rasterio>=1.3"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
tileprep = "tileprep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
